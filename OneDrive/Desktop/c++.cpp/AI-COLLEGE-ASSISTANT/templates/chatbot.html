<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <h2>🎓 AI College Assistant</h2>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<section class="chat-container">

    <h1>🤖 AI College Chatbot</h1>

    <p>
        Ask me anything about your college.
    </p>

    <form method="POST">

        <input
            type="text"
            name="question"
            placeholder="Ask your question..."
            value="{{ question }}"
            required
        >

        <button type="submit">
            Ask AI
        </button>

    </form>

    {% if answer %}

    <div class="chat-answer">

        <h3>🤖 AI Assistant</h3>

        <p>{{ answer }}</p>

    </div>

    {% endif %}

</section>

</body>
</html>
